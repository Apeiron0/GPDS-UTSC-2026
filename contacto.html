<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo GPDS · Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">GPDS</div>
    <div class="navlinks">
      <a href="index.html">Inicio</a>
      <a href="miembros.html">Miembros</a>
      <a href="productos.html">Productos</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html" class="active">Contacto</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <span class="kicker">Hablemos</span>
    <h1>Contacto</h1>
    <p class="lead">¿Tienes dudas o quieres saber más sobre el proyecto? Escríbenos.</p>
  </div>
</header>

<section class="content">
  <div class="wrap contact-grid">
    <div>
      <p>Puedes escribirnos usando el formulario y te responderemos lo antes posible.</p>
    </div>
    <form onsubmit="event.preventDefault(); alert('Mensaje enviado (formulario de demostración).');">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required>
      </div>
      <div>
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
      </div>
      <button type="submit">Enviar mensaje</button>
    </form>
  </div>
  <div class="wrap">
    <a href="index.html" class="back-home">Volver al inicio</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>Equipo GPDS · 2026</span>
    <span>Hecho para la actividad P1-A1</span>
  </div>
</footer>

</body>
</html>
